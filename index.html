<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RKCUBE - Modern Store</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (Version 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --primary: #2563eb; --accent: #f59e0b; --bg: #f8fafc; --white: #ffffff;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: #1e293b; overflow-x: hidden; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .page { display: none; padding: 85px 5% 40px; min-height: 100vh; animation: slideIn 0.4s ease forwards; }
        .page.active { display: block; }

        header {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 12px 5%; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            position: fixed; width: 100%; top: 0; z-index: 1000;
        }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); cursor: pointer; }
        .header-actions { display: flex; align-items: center; gap: 10px; }

        .btn { padding: 10px 18px; border-radius: 12px; cursor: pointer; font-weight: 700; border: none; font-size: 13px; transition: 0.3s; display: flex; align-items: center; gap: 8px; justify-content: center; }
        .btn-p { background: var(--primary); color: white; }
        .btn-s { background: #eff6ff; color: var(--primary); }

        /* Loader */
        #order-processing-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9); z-index: 3000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .main-spinner {
            width: 50px; height: 50px; border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Shop Grid */
        .p-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 768px) { .p-grid { grid-template-columns: repeat(4, 1fr); } }
        .p-card { background: white; padding: 15px; border-radius: 20px; box-shadow: var(--shadow); text-align: center; }
        .p-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 15px; margin-bottom: 8px; }
        .p-card h3 { font-size: 13px; margin-bottom: 5px; height: 35px; overflow: hidden; }
        .p-card .price { color: var(--primary); font-weight: 800; display: block; margin-bottom: 10px; }

        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: var(--shadow); max-width: 500px; margin: 0 auto; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; font-weight: 700; margin-bottom: 5px; color: #64748b; }
        .req::after { content: " *"; color: #ef4444; }
        .form-group input { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 10px; outline: none; }

        /* Statement Box */
        .summary-box { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 18px; border-radius: 18px; margin-top: 15px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
        .total-highlight { 
            background: #2563eb; color: white; padding: 18px; border-radius: 15px; 
            margin-top: 15px; font-weight: 800; font-size: 18px; display: flex; justify-content: space-between;
        }

        .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .opt { border: 2px solid #f1f5f9; padding: 12px; border-radius: 12px; text-align: center; cursor: pointer; font-weight: 700; font-size: 12px; }
        .opt.active { border-color: var(--primary); background: #eff6ff; color: var(--primary); }

        .status-badge { font-size: 10px; padding: 3px 10px; border-radius: 20px; font-weight: 800; }
        .Pending { background: #fef3c7; color: #d97706; }
        .Delivered { background: #dcfce7; color: #16a34a; }

        #toast { position: fixed; bottom: 20px; width: 90%; left: 5%; background: #0f172a; color: white; padding: 15px; border-radius: 12px; text-align: center; display: none; z-index: 2000; }
        footer { background: #0f172a; color: #94a3b8; padding: 30px; text-align: center; font-size: 11px; margin-top: 40px; }
    </style>
</head>
<body>

    <!-- Center Loader -->
    <div id="order-processing-loader">
        <div class="main-spinner"></div>
        <p style="font-weight: 700; color: var(--primary);">Redirecting to Payment...</p>
    </div>

    <!-- Hidden eSewa Form -->
    <form action="https://uat.esewa.com.np/epay/main" method="POST" id="esewa-form" style="display:none;">
        <input value="" name="tAmt" id="esewa-tAmt" type="hidden">
        <input value="" name="amt" id="esewa-amt" type="hidden">
        <input value="0" name="txAmt" type="hidden">
        <input value="0" name="psc" type="hidden">
        <input value="" name="pdc" id="esewa-pdc" type="hidden">
        <input value="EPAYTEST" name="scd" type="hidden">
        <input value="" name="pid" id="esewa-pid" type="hidden">
        <input value="https://www.kbr.com.np" name="su" type="hidden">
        <input value="https://www.kbr.com.np" name="fu" type="hidden">
    </form>

    <header>
        <div class="logo" onclick="navigateTo('home')">RKCUBE</div>
        <div class="header-actions">
            <div id="auth-ui" style="display: flex; gap: 5px;"></div>
            <div class="btn" style="padding: 10px; font-size: 18px;" onclick="navigateTo('cart')">
                <i class="fas fa-shopping-bag"></i><span id="cart-count" style="font-size: 10px; position: absolute; top: 0; right: 0; background: var(--accent); color: white; padding: 2px 5px; border-radius: 50%;">0</span>
            </div>
        </div>
    </header>

    <section id="home" class="page active"><div class="p-grid" id="product-list"></div></section>

    <section id="login" class="page">
        <div class="card" style="max-width: 380px;">
            <h2 style="text-align: center; margin-bottom: 20px;">RKCUBE Login</h2>
            <div class="form-group"><label>Email</label><input type="email" id="log-email"></div>
            <div class="form-group"><label>Password</label><input type="password" id="log-pass"></div>
            <button class="btn btn-p" style="width: 100%;" onclick="handleAuth()">Login</button>
            <p onclick="navigateTo('signup')" style="text-align:center; font-size:12px; margin-top:15px; color:var(--primary);">Don't have an account? Sign Up</p>
        </div>
    </section>

    <section id="signup" class="page">
        <div class="card" style="max-width: 380px;">
            <h2 style="text-align: center; margin-bottom: 20px;">Create Account</h2>
            <div class="form-group"><label>Full Name</label><input type="text" id="reg-name"></div>
            <div class="form-group"><label>Email</label><input type="email" id="reg-email"></div>
            <div class="form-group"><label>Password</label><input type="password" id="reg-pass"></div>
            <button class="btn btn-p" style="width: 100%;" onclick="handleSignup()">Register</button>
        </div>
    </section>

    <section id="cart" class="page">
        <div class="card" style="max-width: 600px;">
            <h2>My Cart</h2>
            <div id="cart-items" style="margin: 20px 0;"></div>
            <button class="btn btn-p" id="btn-to-checkout" style="width: 100%; display: none;" onclick="navigateTo('checkout')">Proceed to Checkout</button>
        </div>
    </section>

    <section id="checkout" class="page">
        <div class="card" style="max-width: 900px;">
            <h2 style="margin-bottom: 20px;">Order Details</h2>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
                <div>
                    <div class="form-group"><label class="req">Receiver Name</label><input type="text" id="c-name"></div>
                    <div class="form-group"><label class="req">Mobile Number</label><input type="tel" id="c-phone"></div>
                    <div class="form-group"><label class="req">Address</label><input type="text" id="c-addr"></div>
                    
                    <label class="req" style="font-size: 11px; font-weight: 800;">Location</label>
                    <div class="opt-grid">
                        <div class="opt" id="opt-home" onclick="setLoc('home')">Home</div>
                        <div class="opt" id="opt-office" onclick="setLoc('office')">Office</div>
                    </div>

                    <label class="req" style="font-size: 11px; font-weight: 800;">Payment</label>
                    <div class="opt-grid">
                        <div class="opt" id="opt-esewa" onclick="setPay('esewa')">eSewa</div>
                        <div class="opt" id="opt-cod" onclick="setPay('cod')">COD</div>
                    </div>
                </div>

                <div class="summary-box">
                    <h3>Statement</h3>
                    <div id="summ-items" style="font-size: 11px; margin: 10px 0;"></div>
                    <div class="stat-row"><span>Products:</span><span id="p-price">Rs. 0</span></div>
                    <div class="stat-row"><span>Delivery:</span><span id="p-del">Rs. 0</span></div>
                    <div class="stat-row" id="p-cod-row" style="display: none; color: red;"><span>COD:</span><span>Rs. 10</span></div>
                    <div class="total-highlight"><span>Total:</span><span id="p-total">Rs. 0</span></div>
                    <button class="btn btn-p" style="width: 100%; margin-top: 20px; background: #10b981;" onclick="placeOrder()">Confirm Order</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Admin & History sections hidden for brevity -->
    <section id="admin-dash" class="page"><div class="card"><h2>Admin Dashboard</h2><div id="admin-orders-container"></div></div></section>
    <section id="my-orders" class="page"><div class="card"><h2>My Orders</h2><div id="user-orders-container"></div></div></section>

    <script>
        // --- FIREBASE CONFIG (Yo same rakhnuhos) ---
        const firebaseConfig = {
  apiKey: "AIzaSyCSuPmip1gdOPNaf047Xoctwv2wRGSKX2g",
  authDomain: "rkcube-3d7e6.firebaseapp.com",
  projectId: "rkcube-3d7e6",
  storageBucket: "rkcube-3d7e6.firebasestorage.app",
  messagingSenderId: "337754647320",
  appId: "1:337754647320:web:074b5c0d3428d43242cc6d"
};
    firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.database();

        var cart = [];
        var locType = "";
        var payMethod = "";
        var products = [
            { id: 1, name: "RK Cube Pro Buds", price: 3500, img: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400" },
            { id: 2, name: "Luxury Smart Watch", price: 4200, img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" },
            { id: 3, name: "RGB Mouse Pad", price: 1200, img: "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=400" }
        ];

        window.navigateTo = function(id) {
            if(id === 'checkout' && !auth.currentUser) { alert("Please Login!"); navigateTo('login'); return; }
            document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
            document.getElementById(id).classList.add('active');
            if(id === 'my-orders') loadUserHistory();
            window.scrollTo(0,0);
        };

        window.handleAuth = function() {
            var e = document.getElementById('log-email').value;
            var p = document.getElementById('log-pass').value;
            if(e === "admin@gmail.com" && p === "admin123") { navigateTo('admin-dash'); loadAdminOrders(); }
            else { auth.signInWithEmailAndPassword(e, p).then(function() { navigateTo('home'); }).catch(function(err) { alert(err.message); }); }
        };

        window.handleSignup = function() {
            var n = document.getElementById('reg-name').value;
            var e = document.getElementById('reg-email').value;
            var p = document.getElementById('reg-pass').value;
            auth.createUserWithEmailAndPassword(e, p).then(function(res) { db.ref('users/' + res.user.uid).set({ name: n, email: e }); navigateTo('home'); }).catch(function(err) { alert(err.message); });
        };

        auth.onAuthStateChanged(function(user) {
            var ui = document.getElementById('auth-ui');
            ui.innerHTML = user ? '<button class="btn btn-s" onclick="navigateTo(\'my-orders\')">History</button><button class="btn btn-s" onclick="firebase.auth().signOut()">Logout</button>' : '<button class="btn btn-s" onclick="navigateTo(\'login\')">Login</button>';
        });

        function renderShop() {
            var html = "";
            products.forEach(function(p) { html += '<div class="p-card"><img src="'+p.img+'"><h3>'+p.name+'</h3><span class="price">Rs. '+p.price+'</span><button class="btn btn-p" style="width:100%" onclick="addToBag('+p.id+')">Add to Cart</button></div>'; });
            document.getElementById('product-list').innerHTML = html;
        }

        window.addToBag = function(id) {
            var p = products.find(function(i) { return i.id === id; });
            cart.push(p);
            updateBag();
        };

        function updateBag() {
            document.getElementById('cart-count').innerText = cart.length;
            var box = document.getElementById('cart-items');
            if(cart.length === 0) { box.innerHTML = "Empty"; document.getElementById('btn-to-checkout').style.display = 'none'; return; }
            document.getElementById('btn-to-checkout').style.display = 'block';
            var h = "";
            cart.forEach(function(item, idx) { h += '<div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee;"><span>'+item.name+'</span><b>Rs. '+item.price+' <i class="fas fa-trash" onclick="removeBag('+idx+')" style="color:red; cursor:pointer; margin-left:10px;"></i></b></div>'; });
            box.innerHTML = h;
        }

        window.removeBag = function(idx) { cart.splice(idx, 1); updateBag(); };

        window.setLoc = function(t) { locType = t; document.getElementById('opt-home').classList.toggle('active', t === 'home'); document.getElementById('opt-office').classList.toggle('active', t === 'office'); updateSummary(); };
        window.setPay = function(m) { payMethod = m; document.getElementById('opt-esewa').classList.toggle('active', m === 'esewa'); document.getElementById('opt-cod').classList.toggle('active', m === 'cod'); updateSummary(); };

        function updateSummary() {
            var sub = 0; cart.forEach(function(i){ sub += i.price; });
            var del = locType === 'home' ? 250 : (locType === 'office' ? 220 : 0);
            var cod = payMethod === 'cod' ? 10 : 0;
            var total = sub + del + cod;
            document.getElementById('p-price').innerText = "Rs. " + sub;
            document.getElementById('p-del').innerText = "Rs. " + del;
            document.getElementById('p-cod-row').style.display = cod > 0 ? 'flex' : 'none';
            document.getElementById('p-total').innerText = "Rs. " + total;
            document.getElementById('summ-items').innerText = cart.map(function(i){ return i.name; }).join(', ');
            
            // Set eSewa hidden fields
            document.getElementById('esewa-amt').value = sub;
            document.getElementById('esewa-pdc').value = del + cod;
            document.getElementById('esewa-tAmt').value = total;
            document.getElementById('esewa-pid').value = "RKC" + Date.now();
        }

        // --- PLACE ORDER WITH ESEWA ---
        window.placeOrder = function() {
            if(!auth.currentUser) return;
            var n = document.getElementById('c-name').value;
            var ph = document.getElementById('c-phone').value;
            var ad = document.getElementById('c-addr').value;

            if(!n || !ph || !ad || !locType || !payMethod) { alert("Fill all details!"); return; }

            if(confirm("Confirm order?")) {
                document.getElementById('order-processing-loader').style.display = 'flex';

                var orderData = {
                    uid: auth.currentUser.uid,
                    customer: n, phone: ph, address: ad,
                    items: cart, total: document.getElementById('p-total').innerText,
                    status: "Pending", payment: payMethod, date: new Date().toLocaleString()
                };

                db.ref('orders').push(orderData, function(error) {
                    if (error) { alert(error.message); document.getElementById('order-processing-loader').style.display = 'none'; } 
                    else {
                        if(payMethod === 'esewa') {
                            document.getElementById('esewa-form').submit();
                        } else {
                            document.getElementById('order-processing-loader').style.display = 'none';
                            alert("✅ Order Placed! (COD)");
                            cart = []; updateBag(); navigateTo('home');
                        }
                    }
                });
            }
        };

        // Admin & User history logic (kept same as previous version)
        function loadAdminOrders() {
            db.ref('orders').on('value', function(snap) {
                var h = ""; snap.forEach(function(child) {
                    var d = child.val();
                    h += '<div class="order-item"><b>'+d.customer+'</b><br>'+d.total+'<br>Status: '+d.status+'</div>';
                });
                document.getElementById('admin-orders-container').innerHTML = h;
            });
        }
        function loadUserHistory() {
            db.ref('orders').on('value', function(snap) {
                var h = ""; snap.forEach(function(child) {
                    var d = child.val();
                    if(d.uid === auth.currentUser.uid) h += '<div class="order-item"><b>'+d.date+'</b> - '+d.total+'</div>';
                });
                document.getElementById('user-orders-container').innerHTML = h;
            });
        }

        renderShop();
    </script>
</body>
</html>
