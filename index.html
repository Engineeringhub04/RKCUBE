<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RKCUBE - Modern E-commerce</title>
    
    <!-- Premium Fonts & Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (v8 Stable for Hopweb) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- Official eSewa V2 Signature Modules -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.9-1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.9-1/hmac-sha256.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.9-1/enc-base64.min.js"></script>

    <style>
        :root {
            --primary: #2563eb; --primary-dark: #1d4ed8; --accent: #f59e0b;
            --bg: #f8fafc; --white: #ffffff; --text: #1e293b;
            --shadow: 0 10px 30px rgba(0,0,0,0.08); --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* Animations */
        @keyframes pageIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .page { display: none; padding: 100px 5% 40px; min-height: 100vh; animation: pageIn 0.5s ease forwards; }
        .page.active { display: block; }

        /* Responsive Header */
        header {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px);
            padding: 12px 5%; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.05); position: fixed; width: 100%; top: 0; z-index: 1000;
        }
        .logo { font-size: 20px; font-weight: 800; color: var(--primary); cursor: pointer; white-space: nowrap; }
        .header-actions { display: flex; align-items: center; gap: 8px; }

        /* Mobile Header Fix */
        @media (max-width: 480px) {
            header { padding: 12px 3%; }
            .logo { font-size: 17px; }
            .btn-header { padding: 6px 10px !important; font-size: 11px !important; border-radius: 10px !important; }
            .cart-btn { font-size: 16px !important; padding: 5px !important; }
        }

        /* Modern Buttons */
        .btn { padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 700; border: none; transition: var(--transition); display: flex; align-items: center; gap: 8px; justify-content: center; }
        .btn:active { transform: scale(0.92); transition: 0.1s; }
        .btn-p { background: var(--primary); color: white; }
        .btn-s { background: #eff6ff; color: var(--primary); }
        .cart-btn { position: relative; padding: 10px; cursor: pointer; font-size: 20px; }
        #cart-count { position: absolute; top: 0; right: 0; background: var(--accent); color: white; font-size: 10px; padding: 2px 6px; border-radius: 50%; font-weight: 800; }

        /* Product Cards */
        .p-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .p-card { background: white; padding: 15px; border-radius: 20px; box-shadow: var(--shadow); text-align: center; border: 1px solid transparent; }
        .p-card:hover { transform: translateY(-8px); border-color: var(--primary); }
        .p-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 15px; margin-bottom: 10px; }
        .p-card h3 { font-size: 15px; margin-bottom: 5px; font-weight: 700; }
        .p-card .price { color: var(--primary); font-weight: 800; font-size: 18px; display: block; margin-bottom: 10px; }

        /* Checkout Card */
        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: var(--shadow); max-width: 500px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 11px; font-weight: 800; margin-bottom: 5px; color: #64748b; }
        .req::after { content: " *"; color: #ef4444; }
        .form-group input { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 12px; outline: none; transition: 0.3s; }
        .invalid { border-color: #ef4444 !important; background: #fff5f5; animation: shakeX 0.4s; }

        /* Summary Styling */
        .summary-box { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 18px; border-radius: 18px; margin-top: 15px; }
        .total-box { background: #2563eb; color: white; padding: 18px; border-radius: 16px; margin-top: 15px; font-weight: 800; font-size: 19px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 20px rgba(37,99,235,0.2); }

        .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .opt { border: 2px solid #f1f5f9; padding: 12px; border-radius: 12px; text-align: center; cursor: pointer; font-weight: 700; font-size: 12px; transition: 0.3s; }
        .opt.active { border-color: var(--primary); background: #eff6ff; color: var(--primary); }

        #order-processing-loader { position: fixed; inset: 0; background: rgba(255, 255, 255, 0.95); z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid #eee; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes shakeX { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }

        footer { background: #0f172a; color: #94a3b8; padding: 40px 5%; text-align: center; font-size: 11px; margin-top: 50px; }
    </style>
</head>
<body>

    <div id="order-processing-loader">
        <div class="spinner"></div>
        <p style="margin-top: 15px; font-weight: 800; color: var(--primary);">AUTHENTICATING...</p>
    </div>

    <!-- Hidden eSewa V2 Form -->
    <form action="https://rc-epay.esewa.com.np/api/epay/main/v2/form" method="POST" id="esewa-form" style="display:none;">
        <input type="text" id="amount" name="amount" required>
        <input type="text" id="tax_amount" name="tax_amount" value="0" required>
        <input type="text" id="total_amount" name="total_amount" required>
        <input type="text" id="transaction_uuid" name="transaction_uuid" required>
        <input type="text" id="product_code" name="product_code" value="EPAYTEST" required>
        <input type="text" id="product_service_charge" name="product_service_charge" value="0" required>
        <input type="text" id="product_delivery_charge" name="product_delivery_charge" value="0" required>
        <input type="text" id="success_url" name="success_url" value="https://www.kbr.com.np" required>
        <input type="text" id="failure_url" name="failure_url" value="https://www.kbr.com.np" required>
        <input type="text" id="signed_field_names" name="signed_field_names" value="total_amount,transaction_uuid,product_code" required>
        <input type="text" id="signature" name="signature" required>
    </form>

    <header>
        <div class="logo" onclick="navigateTo('home')">RKCUBE STORE</div>
        <div class="header-actions">
            <div id="auth-ui" style="display: flex; gap: 5px;"></div>
            <div class="cart-btn" onclick="navigateTo('cart')">
                <i class="fas fa-shopping-bag"></i><span id="cart-count">0</span>
            </div>
        </div>
    </header>

    <section id="home" class="page active"><div class="p-grid" id="product-list"></div></section>

    <section id="login" class="page">
        <div class="card" style="max-width: 380px;">
            <h2 style="text-align: center; margin-bottom: 20px; font-weight: 800;">Log In</h2>
            <div class="form-group"><label>Email</label><input type="email" id="log-email"></div>
            <div class="form-group"><label>Password</label><input type="password" id="log-pass"></div>
            <button class="btn btn-p" style="width: 100%; height: 50px;" onclick="handleAuth()">Sign In</button>
            <p onclick="navigateTo('signup')" style="text-align:center; font-size:12px; margin-top:20px; color:var(--primary); font-weight:700;">Create account</p>
        </div>
    </section>

    <section id="signup" class="page">
        <div class="card" style="max-width: 380px;">
            <h2 style="text-align: center; margin-bottom: 20px; font-weight: 800;">Sign Up</h2>
            <div class="form-group"><label>Name</label><input type="text" id="reg-name"></div>
            <div class="form-group"><label>Email</label><input type="email" id="reg-email"></div>
            <div class="form-group"><label>Password</label><input type="password" id="reg-pass"></div>
            <button class="btn btn-p" style="width: 100%; height: 50px;" onclick="handleSignup()">Join RKCUBE</button>
        </div>
    </section>

    <section id="cart" class="page">
        <div class="card" style="max-width: 600px;">
            <h2 style="margin-bottom: 20px; font-weight: 800;">My Cart</h2>
            <div id="cart-items-list" style="margin-bottom: 20px;"></div>
            <button class="btn btn-p" id="btn-checkout" style="width: 100%; display: none;" onclick="navigateTo('checkout')">Check Out</button>
        </div>
    </section>

    <section id="checkout" class="page">
        <div class="card" style="max-width: 900px;">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
                <div>
                    <div class="form-group"><label class="req">Full Name</label><input type="text" id="c-name" class="v-field"></div>
                    <div class="form-group"><label class="req">Phone</label><input type="tel" id="c-phone" class="v-field"></div>
                    <div class="form-group"><label class="req">Address</label><input type="text" id="c-addr" class="v-field"></div>
                    <label class="req" style="font-size: 11px; font-weight: 800;">Location</label>
                    <div class="opt-grid"><div class="opt" id="opt-home" onclick="setLoc('home')">Home</div><div class="opt" id="opt-office" onclick="setLoc('office')">Office</div></div>
                    <label class="req" style="font-size: 11px; font-weight: 800;">Payment</label>
                    <div class="opt-grid"><div class="opt" id="opt-esewa" onclick="setPay('esewa')">eSewa</div><div class="opt" id="opt-cod" onclick="setPay('cod')">COD</div></div>
                </div>
                <div class="summary-box">
                    <h3 style="margin-bottom:15px;">Statement</h3>
                    <div id="p-price" style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>Price:</span><span>Rs. 0</span></div>
                    <div id="p-del" style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>Delivery:</span><span>Rs. 0</span></div>
                    <div id="p-cod-row" style="display:none; justify-content:space-between; margin-bottom:8px; color:red;"><span>COD:</span><span>Rs. 10</span></div>
                    <div class="total-box"><span>Payable</span><span id="p-total">Rs. 0</span></div>
                    <button class="btn btn-p" style="width:100%; margin-top:20px; background:#10b981;" onclick="placeOrder()">Confirm Order</button>
                </div>
            </div>
        </div>
    </section>

    <section id="admin-dash" class="page"><div class="card" style="max-width:900px;"><h2>Admin Dashboard</h2><div id="admin-orders-box"></div><button class="btn btn-s" onclick="location.reload()" style="margin-top:20px;">Exit</button></div></section>
    <section id="my-orders" class="page"><div class="card" style="max-width:600px;"><h2>My Orders</h2><div id="user-orders-box" style="margin-top:15px;"></div></div></section>

    <footer><p>&copy; 2024 RKCUBE Official Store. Quality over Quantity.</p></footer>

    <script>
        // --- 1. FIREBASE CONFIG ---
        const firebaseConfig = { apiKey: "AIzaSyCSuPmip1gdOPNaf047Xoctwv2wRGSKX2g", authDomain: "rkcube-3d7e6.firebaseapp.com", databaseURL: "https://rkcube-3d7e6-default-rtdb.firebaseio.com", projectId: "rkcube-3d7e6", storageBucket: "rkcube-3d7e6.firebasestorage.app", messagingSenderId: "337754647320", appId: "1:337754647320:web:074b5c0d3428d43242cc6d" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let cart = [], locType = "", payMethod = "", redirectPath = "home";
        const products = [
            { id: 1, name: "RK Cube Pro Buds", price: 3200, img: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400" },
            { id: 2, name: "AMOLED Smart Watch", price: 4500, img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" },
            { id: 3, name: "RGB Mechanical Key", price: 5800, img: "https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?w=400" }
        ];

        // --- 2. CORE LOGIC ---
        window.navigateTo = function(id) {
            if(id === 'checkout' && !auth.currentUser) { redirectPath = 'checkout'; navigateTo('login'); return; }
            if(id === 'my-orders') loadHistory();
            if(id !== 'login' && id !== 'signup') redirectPath = id;
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
        };

        window.handleAuth = function() {
            const e = document.getElementById('log-email').value;
            const p = document.getElementById('log-pass').value;
            if(e === "admin@gmail.com" && p === "admin123") { navigateTo('admin-dash'); loadAdmin(); }
            else { auth.signInWithEmailAndPassword(e, p).then(() => navigateTo(redirectPath)).catch(err => alert(err.message)); }
        };

        window.handleSignup = function() {
            auth.createUserWithEmailAndPassword(document.getElementById('reg-email').value, document.getElementById('reg-pass').value).then(res => {
                db.ref('users/' + res.user.uid).set({ name: document.getElementById('reg-name').value });
                navigateTo(redirectPath);
            }).catch(err => alert(err.message));
        };

        auth.onAuthStateChanged(user => {
            const ui = document.getElementById('auth-ui');
            ui.innerHTML = user ? `<button class="btn btn-s btn-header" onclick="navigateTo('my-orders')">Orders</button><button class="btn btn-s btn-header" onclick="auth.signOut()">Logout</button>` : `<button class="btn btn-s btn-header" onclick="navigateTo('login')">Login</button>`;
        });

        // --- 3. SHOP & CART ---
        function renderShop() {
            let h = ""; products.forEach(p => h += `<div class="p-card"><img src="${p.img}"><h3>${p.name}</h3><span class="price">Rs. ${p.price}</span><button class="btn btn-p" style="width:100%" onclick="addToBag(${p.id})">Add to Cart</button></div>`);
            document.getElementById('product-list').innerHTML = h;
        }

        window.addToBag = function(id) { cart.push(products.find(i => i.id === id)); updateBag(); };
        function updateBag() {
            document.getElementById('cart-count').innerText = cart.length;
            const box = document.getElementById('cart-items-list');
            document.getElementById('btn-checkout').style.display = cart.length > 0 ? 'block' : 'none';
            box.innerHTML = cart.map((i, idx) => `<div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #eee;"><span>${i.name}</span><b>Rs. ${i.price} <i class="fas fa-trash" onclick="removeBag(${idx})" style="color:red; margin-left:10px;"></i></b></div>`).join('');
        }
        window.removeBag = idx => { cart.splice(idx, 1); updateBag(); };

        window.setLoc = t => { locType = t; document.getElementById('opt-home').classList.toggle('active', t==='home'); document.getElementById('opt-office').classList.toggle('active', t==='office'); updateSummary(); };
        window.setPay = m => { payMethod = m; document.getElementById('opt-esewa').classList.toggle('active', m==='esewa'); document.getElementById('opt-cod').classList.toggle('active', m==='cod'); updateSummary(); };

        function updateSummary() {
            let sub = 0; cart.forEach(i => sub += i.price);
            let del = locType==='home' ? 250 : (locType==='office' ? 220 : 0);
            let cod = payMethod==='cod' ? 10 : 0;
            document.getElementById('p-price').innerHTML = `<span>Price:</span><span>Rs. ${sub}</span>`;
            document.getElementById('p-del').innerHTML = `<span>Delivery:</span><span>Rs. ${del}</span>`;
            document.getElementById('p-cod-row').style.display = cod > 0 ? 'flex' : 'none';
            document.getElementById('p-total').innerHTML = `<span>Total:</span><span>Rs. ${sub + del + cod}</span>`;
        }

        // --- 4. OFFICIAL SIGNATURE FIX ---
        function generateSignature(total_amount, transaction_uuid, product_code) {
            const secretKey = "8gBm/:&EnhH.1/q"; 
            const message = `total_amount=${total_amount},transaction_uuid=${transaction_uuid},product_code=${product_code}`;
            const hash = CryptoJS.HmacSHA256(message, secretKey);
            return CryptoJS.enc.Base64.stringify(hash);
        }

        window.placeOrder = function() {
            if(!auth.currentUser) return;
            const n = document.getElementById('c-name').value, ph = document.getElementById('c-phone').value, ad = document.getElementById('c-addr').value;
            if(!n || !ph || !ad || !locType || !payMethod) { document.querySelectorAll('.v-field').forEach(f => { if(!f.value) f.classList.add('invalid'); }); alert("Fill all details!"); return; }

            if(confirm("Confirm Order?")) {
                document.getElementById('order-processing-loader').style.display = 'flex';
                let sub = 0; cart.forEach(i => sub += i.price);
                let del = locType==='home' ? 250 : (locType==='office' ? 220 : 0);
                let cod = payMethod==='cod' ? 10 : 0;
                let total = sub + del + cod;
                const uuid = "RKC-" + Date.now();

                const orderData = { uid: auth.currentUser.uid, customer: n, phone: ph, items: cart.map(i => i.name), total: total, status: "Pending", payment: payMethod, date: new Date().toLocaleString() };

                db.ref('orders').push(orderData, (err) => {
                    if(err) { alert(err.message); document.getElementById('order-processing-loader').style.display = 'none'; }
                    else {
                        if(payMethod === 'esewa') {
                            document.getElementById('amount').value = sub;
                            document.getElementById('product_delivery_charge').value = del + cod;
                            document.getElementById('total_amount').value = total;
                            document.getElementById('transaction_uuid').value = uuid;
                            document.getElementById('signature').value = generateSignature(total, uuid, "EPAYTEST");
                            setTimeout(() => document.getElementById('esewa-form').submit(), 500);
                        } else {
                            document.getElementById('order-processing-loader').style.display = 'none';
                            alert("Order Success!"); cart = []; updateBag(); navigateTo('home');
                        }
                    }
                });
            }
        };

        function loadAdmin() {
            db.ref('orders').on('value', snap => {
                let h = ""; snap.forEach(c => { h += `<div class="order-card"><b>${c.val().customer}</b><br>Rs. ${c.val().total} (${c.val().status})</div>`; });
                document.getElementById('admin-orders-box').innerHTML = h;
            });
        }
        function loadHistory() {
            db.ref('orders').on('value', snap => {
                let h = ""; snap.forEach(c => { if(c.val().uid === auth.currentUser.uid) h += `<div class="order-card"><b>${c.val().date}</b><br>Rs. ${c.val().total} <span class="status-badge ${c.val().status}">${c.val().status}</span></div>`; });
                document.getElementById('user-orders-box').innerHTML = h || "No orders.";
            });
        }
        renderShop();
    </script>
</body>
</html>
