<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loksewa Solution - Authentication</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: #f8fafc; height: 100vh; display: flex; align-items: center; justify-content: center; }

        /* --- 404 Hidden UI --- */
        #not-found-ui { display: none; text-align: center; }
        #not-found-ui h1 { font-size: 80px; color: #cbd5e1; }
        #not-found-ui p { color: #64748b; font-size: 18px; margin-top: 10px; }

        /* --- Success Card UI --- */
        #success-ui { display: none; width: 90%; max-width: 420px; }
        .card { background: white; padding: 45px 35px; border-radius: 35px; box-shadow: 0 20px 50px rgba(10, 71, 194, 0.08); text-align: center; border: 1px solid rgba(0,0,0,0.02); }
        
        .icon-wrapper { width: 90px; height: 90px; background: #135bec; border-radius: 45px; display: flex; align-items: center; justify-content: center; margin: 0 auto 30px; box-shadow: 0 10px 20px rgba(19, 91, 236, 0.3); }
        
        h2 { color: #0f172a; font-size: 26px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.5px; }
        p.msg { color: #64748b; font-size: 15px; line-height: 1.6; margin-bottom: 35px; }
        
        /* Countdown Bar */
        .progress-container { width: 100%; height: 6px; background: #f1f5f9; border-radius: 10px; overflow: hidden; margin-bottom: 25px; }
        .progress-fill { width: 0%; height: 100%; background: #135bec; border-radius: 10px; }

        .btn { display: block; width: 100%; background: #0f172a; color: white; padding: 18px; border-radius: 18px; text-decoration: none; font-weight: 700; font-size: 15px; transition: 0.3s; letter-spacing: 0.5px; }
        .btn:hover { background: #135bec; transform: translateY(-2px); }
        .footer-text { margin-top: 25px; font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

    <!-- 404 UI (Shown if direct access) -->
    <div id="not-found-ui">
        <h1>404</h1>
        <p>Oops! This page does not exist.</p>
    </div>

    <!-- Success UI (Shown if Firebase link) -->
    <div id="success-ui">
        <div class="card">
            <div class="icon-wrapper">
                <svg width="45" height="45" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <h2>Verification Done!</h2>
            <p class="msg">Your security credentials have been updated. We are taking you back to the app.</p>
            
            <!-- Countdown Animation Bar -->
            <div class="progress-container">
                <div id="bar" class="progress-fill"></div>
            </div>

            <a href="loksewasolution://personal-info" class="btn">GO BACK TO APP</a>
            <p class="footer-text">Loksewa Solution</p>
        </div>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            // Firebase le 'oobCode' pathauchha. Yadi yo xaina bhane user direct aayeko ho.
            const oobCode = urlParams.get('oobCode');

            const successUI = document.getElementById('success-ui');
            const notFoundUI = document.getElementById('not-found-ui');
            const bar = document.getElementById('bar');
            const appLink = "loksewasolution://personal-info";

            if (oobCode) {
                // Link is valid, show Success UI
                successUI.style.display = 'block';
                
                // Start Countdown Bar (2 Seconds)
                let width = 0;
                const interval = setInterval(function() {
                    if (width >= 100) {
                        clearInterval(interval);
                        // Auto Redirect
                        window.location.href = appLink;
                    } else {
                        width += 1;
                        bar.style.width = width + '%';
                    }
                }, 20); // 20ms * 100 = 2000ms (2 seconds)

            } else {
                // Link is invalid (direct access), show 404 UI
                notFoundUI.style.display = 'block';
            }
        };
    </script>
</body>
</html>
