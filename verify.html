<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loksewa Solution - Account Action</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; padding: 40px; border-radius: 35px; box-shadow: 0 20px 50px rgba(10, 71, 194, 0.08); text-align: center; max-width: 420px; width: 90%; display: none; }
        .icon-wrapper { width: 80px; height: 80px; background: #135bec; border-radius: 40px; display: flex; align-items: center; justify-content: center; margin: 0 auto 25px; }
        h2 { color: #0f172a; font-size: 24px; font-weight: 800; margin-bottom: 15px; }
        p { color: #64748b; font-size: 15px; line-height: 1.6; margin-bottom: 25px; }
        
        /* Input & Form Styles */
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1.5px solid #e2e8f0; margin-bottom: 15px; font-size: 16px; outline: none; }
        input:focus { border-color: #135bec; }
        
        .btn { display: block; width: 100%; background: #135bec; color: white; padding: 18px; border-radius: 15px; text-decoration: none; font-weight: 700; border: none; cursor: pointer; font-size: 15px; }
        .btn:disabled { background: #cbd5e1; }

        /* Progress Bar */
        .progress-container { width: 100%; height: 6px; background: #f1f5f9; border-radius: 10px; overflow: hidden; margin-bottom: 25px; display: none; }
        .progress-fill { width: 0%; height: 100%; background: #10b981; border-radius: 10px; }
        
        #not-found { color: #94a3b8; text-align: center; display: none; }
    </style>
</head>
<body>

    <!-- 1. PASSWORD RESET UI -->
    <div id="reset-ui" class="card">
        <div class="icon-wrapper">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3-3.5 3.5z"/></svg>
        </div>
        <h2>Reset Password</h2>
        <p>Please enter your new secure password for Loksewa Solution.</p>
        <input type="password" id="new-password" placeholder="New Password (min 6 chars)">
        <button id="reset-btn" class="btn" onclick="handleReset()">UPDATE PASSWORD</button>
    </div>

    <!-- 2. EMAIL VERIFY / SUCCESS UI -->
    <div id="success-ui" class="card">
        <div id="success-icon" class="icon-wrapper" style="background: #10b981;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <h2 id="success-title">Verification Done!</h2>
        <p id="success-msg">Your credentials are updated. Returning to app...</p>
        <div id="p-bar" class="progress-container"><div id="bar" class="progress-fill"></div></div>
        <a href="loksewasolution://login" class="btn" style="background: #0f172a;">OPEN APP NOW</a>
    </div>

    <!-- 3. ERROR UI -->
    <div id="not-found">
        <h1 style="font-size: 60px;">404</h1>
        <p>Invalid or expired link.</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');
        const oobCode = urlParams.get('oobCode');
        const apiKey = urlParams.get('apiKey');

        window.onload = function() {
            if (!oobCode) {
                document.getElementById('not-found').style.display = 'block';
                return;
            }

            if (mode === 'resetPassword') {
                document.getElementById('reset-ui').style.display = 'block';
            } else if (mode === 'verifyEmail' || mode === 'verifyBeforeUpdateEmail') {
                document.getElementById('success-ui').style.display = 'block';
                startRedirectCountdown();
            } else {
                document.getElementById('not-found').style.display = 'block';
            }
        };

        // PASSWORD RESET LOGIC
        async function handleReset() {
            const newPassword = document.getElementById('new-password').value;
            if (newPassword.length < 6) return alert("Password must be at least 6 characters.");

            const btn = document.getElementById('reset-btn');
            btn.disabled = true;
            btn.innerText = "UPDATING...";

            try {
                const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:resetPassword?key=${apiKey}`, {
                    method: 'POST',
                    body: JSON.stringify({ oobCode, newPassword }),
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();

                if (data.email) {
                    // Success: Show Success UI
                    document.getElementById('reset-ui').style.display = 'none';
                    document.getElementById('success-ui').style.display = 'block';
                    document.getElementById('success-title').innerText = "Password Changed!";
                    document.getElementById('success-msg').innerText = "Your new password is set. Please login in the app.";
                    startRedirectCountdown();
                } else {
                    alert("Error: " + data.error.message);
                    btn.disabled = false;
                    btn.innerText = "UPDATE PASSWORD";
                }
            } catch (e) {
                alert("Connection failed.");
                btn.disabled = false;
            }
        }

        // REDIRECT LOGIC
        function startRedirectCountdown() {
            const pBar = document.getElementById('p-bar');
            const bar = document.getElementById('bar');
            pBar.style.display = 'block';
            let width = 0;
            const interval = setInterval(function() {
                if (width >= 100) {
                    clearInterval(interval);
                    window.location.href = "loksewasolution://login";
                } else {
                    width += 1;
                    bar.style.width = width + '%';
                }
            }, 25); 
        }
    </script>
</body>
</html>
